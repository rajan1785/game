name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run standalone
      - uses: actions/upload-artifact@v4
        with:
          name: lumina-blocks
          path: |
            web
            dist/LuminaBlocks.html
